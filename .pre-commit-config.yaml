# Hooks run against this repository itself.
# Run hooks only on commit. Otherwise a commit-msg hook installed for prek runs hooks without a `stages` setting, such as
# prettier, on the commit message file.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: c035d5c3fc2ce295b961030061d09de67d9203dc # frozen: v3.10.1
    hooks:
      - id: prettier
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # frozen: v2.4.1
    hooks:
      - id: mypy
        # Check the package as a whole (per pyproject `files`), not file by file,
        # so relative imports resolve.
        pass_filenames: false
        args: [--strict]
  # Ruff's linter covers the pyflakes (F) rules and more, complementing mypy by reporting unused imports and names,
  # which mypy --strict does not. The formatter keeps Python style consistent (prettier does not touch .py).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

# Hooks run against this repository itself.
repos:
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b # frozen: v2.4.0
    hooks:
      - id: mypy
        # Check the package as a whole (per pyproject `files`), not file by file,
        # so relative imports resolve.
        pass_filenames: false
        args: [--strict]
  # Ruff's linter covers the pyflakes (F) rules and more, complementing mypy by reporting unused imports and names,
  # which mypy --strict does not. The formatter keeps Python style consistent (prettier does not touch .py).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
